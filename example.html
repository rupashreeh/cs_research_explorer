<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Worked Examples</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="lineage.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/roughjs/4.6.6/rough.js"></script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Worked Examples</h1>
    <nav class="page-nav">
      <a href="./index.html">Explorer</a>
      <a id="crossLink" data-page="story.html" href="story.html">Story</a>
      <a class="here">Examples</a>
    </nav>
  </header>

  <form class="search-card" id="seekForm">
    <input id="q" type="text" placeholder="logic, type theory, concurrency&hellip;" aria-label="Name a field" autocomplete="off">
    <button type="submit">Explore &rarr;</button>
  </form>

  <nav class="crumbs" id="crumbs" aria-label="Trail" hidden></nav>

  <h2 class="node-name" id="nodeName">Logic</h2>
  <p class="node-blurb" id="nodeBlurb"></p>

  <section class="example" id="exampleBlock" hidden>
    <span class="tag">Running example</span>
    <h3 id="exTitle"></h3>
    <p id="exText"></p>
  </section>

  <div id="childBlock" class="demands">
    <ul class="chips" id="chips"></ul>
  </div>

  <div class="actions" id="actions">
    <button class="primary" id="walkBtn">Walk the example</button>
  </div>

  <div id="status"></div>
  <div class="story" id="walk"></div>

  <footer>Executable claims are run against concrete states. <em>Refuted</em> is a counterexample; <em>survived</em> only means none was found. Prose is checked by nothing.</footer>
</div>
<script src="lineage-core.js"></script>
<script src="example.js"></script>
</body>
</html>
