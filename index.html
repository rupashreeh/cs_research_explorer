<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PL &amp; Formal Methods Concept Explorer</title>
<link rel="stylesheet" href="lineage.css">
</head>
<body>
<div class="wrap home">
  <header class="masthead">
    <h1>PL &amp; Formal Methods Concept Explorer</h1>
    <p>Name a field and find out how it got to be the way it is.</p>
  </header>

  <form class="search-card" id="seekForm">
    <input id="q" type="text" placeholder="logic, type theory, consensus, model checking&hellip;" aria-label="Name a field" autocomplete="off">
    <button class="btn-primary" type="submit">Open it</button>
  </form>

  <div class="actions" id="actions">
    <a class="btn-ghost" id="toHistory" data-page="history.html" href="history.html">Read how it got here</a>
    <a class="btn-ghost" id="toExample" data-page="example.html" href="example.html">Work through an example</a>
  </div>

  <div id="status"></div>

  <footer>Everything here is generated. The history page checks every paper against Semantic Scholar before citing it. The example page tries to refute its own claims.</footer>
</div>
<script src="lineage-core.js"></script>
<script src="index.js"></script>
</body>
</html>
