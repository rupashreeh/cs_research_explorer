<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept Lineage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="lineage.css">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Concept Lineage</h1>
    <nav class="page-nav">
      <a href="./index.html">Explorer</a>
      <a class="here">Story</a>
      <a id="crossLink" data-page="example.html" href="example.html">Examples</a>
    </nav>
  </header>

  <form class="search-card" id="seekForm">
    <input id="q" type="text" placeholder="logic, type theory, concurrency&hellip;" aria-label="Name a field" autocomplete="off">
    <button type="submit">Explore &rarr;</button>
  </form>

  <nav class="crumbs" id="crumbs" aria-label="Trail" hidden></nav>

  <h2 class="node-name" id="nodeName">Logic</h2>
  <p class="node-blurb" id="nodeBlurb"></p>

  <div id="childBlock">
    <ul class="chips" id="chips"></ul>
  </div>

  <div class="actions" id="actions">
    <button class="primary" id="tellStory">Tell the story</button>
  </div>

  <div id="status"></div>
  <div class="story" id="story"></div>

  <footer>Drafted by one model, citations audited by a second and checked against Semantic Scholar. Papers marked <em>no match</em> or <em>disputed</em> are unverified.</footer>
</div>
<script src="lineage-core.js"></script>
<script src="story.js"></script>
</body>
</html>
